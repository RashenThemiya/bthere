spring.application.name=jobhub
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobhub?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

app.bootstrap.super-admin.enabled=${SUPER_ADMIN_BOOTSTRAP_ENABLED:true}
app.bootstrap.super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
app.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@jobhub.local}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:}

app.bootstrap.default-market.enabled=${DEFAULT_MARKET_BOOTSTRAP_ENABLED:true}
app.bootstrap.default-market.name=${DEFAULT_MARKET_NAME:Sri Lanka}
app.bootstrap.default-market.country-code=${DEFAULT_MARKET_COUNTRY_CODE:LK}
app.bootstrap.default-market.currency=${DEFAULT_MARKET_CURRENCY:LKR}
app.bootstrap.default-market.timezone=${DEFAULT_MARKET_TIMEZONE:Asia/Colombo}
app.bootstrap.default-market.locale=${DEFAULT_MARKET_LOCALE:en-LK}
app.bootstrap.default-market.phone-country-code=${DEFAULT_MARKET_PHONE_CODE:+94}

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS:900}
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.security.google.client-id=${GOOGLE_CLIENT_ID:}
app.security.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

app.security.otp.hash-secret=${OTP_HASH_SECRET:}
app.security.otp.expiry-seconds=${OTP_EXPIRY_SECONDS:300}
app.security.otp.resend-seconds=${OTP_RESEND_SECONDS:60}
app.security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.security.otp.aws-region=${AWS_REGION:ap-south-1}
app.security.otp.sender-id=${TEXTLK_SENDER_ID:CareHub}
app.security.otp.textlk-token=${TEXTLK_API_TOKEN:}
app.security.otp.textlk-endpoint=${TEXTLK_API_ENDPOINT:https://app.text.lk/api/v3/sms/send}
app.security.email.from=${AWS_SES_FROM_EMAIL:}

app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.region=${AWS_S3_REGION:${AWS_REGION:ap-south-1}}
app.storage.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:10MB}
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Scheduled request checkout is opt-in; select PAYHERE in gateway settings as well.
booking.payhere.enabled=${BOOKING_PAYHERE_ENABLED:false}
booking.payhere.sandbox=${BOOKING_PAYHERE_SANDBOX:true}
booking.payhere.merchant-id=${BOOKING_PAYHERE_MERCHANT_ID:}
booking.payhere.merchant-secret=${BOOKING_PAYHERE_MERCHANT_SECRET:}
booking.payhere.notify-url=${BOOKING_PAYHERE_NOTIFY_URL:}
booking.payhere.return-url=${BOOKING_PAYHERE_RETURN_URL:}
booking.payhere.cancel-url=${BOOKING_PAYHERE_CANCEL_URL:}
booking.verification-key=${BOOKING_VERIFICATION_KEY:}
booking.expiry-scan-ms=${BOOKING_EXPIRY_SCAN_MS:5000}
booking.push.service-account-file=${BOOKING_PUSH_SERVICE_ACCOUNT_FILE:}
