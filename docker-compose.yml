services:
  jobhub:
    image: ${DOCKER_IMAGE:-jobhub:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobhub
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8083}:8080"
    networks:
      - distribution-system

networks:
  distribution-system:
    external: true
    name: distribution-system_default
