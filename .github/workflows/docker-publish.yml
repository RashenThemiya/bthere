name: Build and publish Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jobhub:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jobhub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH access
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          AWS_PORT="${AWS_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/aws_key
          chmod 600 ~/.ssh/aws_key
          ssh-keyscan -p "$AWS_PORT" -H "$AWS_HOST" >> ~/.ssh/known_hosts

      - name: Pull and run the latest image on AWS
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
          APP_ENV: ${{ secrets.APP_ENV }}
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/jobhub:latest
        run: |
          AWS_PORT="${AWS_PORT:-22}"
          APP_ENV_BASE64="$(printf '%s' "$APP_ENV" | base64 -w 0)"

          ssh -i ~/.ssh/aws_key -p "$AWS_PORT" "$AWS_USERNAME@$AWS_HOST" \
            "sudo install -m 700 -d /opt/jobhub && \
             printf '%s' '$APP_ENV_BASE64' | base64 --decode | sudo tee /opt/jobhub/.env > /dev/null && \
             sudo chmod 600 /opt/jobhub/.env"

          ssh -i ~/.ssh/aws_key -p "$AWS_PORT" "$AWS_USERNAME@$AWS_HOST" \
            "sudo docker pull '$IMAGE_NAME' && \
             (sudo docker rm -f jobhub || true) && \
             sudo docker run -d \
               --name jobhub \
               --restart unless-stopped \
               --network distribution-system_default \
               --env-file /opt/jobhub/.env \
               -p 8083:8080 \
               '$IMAGE_NAME'"
